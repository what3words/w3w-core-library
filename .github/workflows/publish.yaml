# .github/workflows/build-deploy-artifacts.yml
name: Build and Deploy Artifacts

on:
  push:
    branches:
      - main
      - staging
      - 'epic/**'
    tags:
      - 'v*'
      - 'd*'
  workflow_dispatch:    # Allow manual triggering

jobs:
  build-publish-library:
    name: Release build and publish
    runs-on: macOS-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Publish a -SNAPSHOT from staging (and epic/** branches); main stays a release build.
      - name: Mark build as SNAPSHOT
        if: github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/epic/')
        run: |
          sed -i.bak 's/^VERSION_NAME=.*/&-SNAPSHOT/' gradle.properties && rm -f gradle.properties.bak
          echo "Publishing SNAPSHOT version:"
          grep '^VERSION_NAME=' gradle.properties

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}